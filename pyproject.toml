[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-weightpack"
version = "0.1.0"
description = "Lossless packing of affine quantization metadata for MLX models."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "safetensors>=0.4.3"]
authors = [{name = "Davcca"}]
keywords = ["mlx", "apple-silicon", "quantization", "safetensors"]

[project.optional-dependencies]
metal = [
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
weightpack = "weightpack.cli:main"

[project.urls]
Repository = "https://github.com/Davcca/mlx-weightpack"
Issues = "https://github.com/Davcca/mlx-weightpack/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
weightpack = ["metal/*.h", "metal/*.metal", "notices/*.txt"]

[tool.ruff]
target-version = "py310"
line-length = 100
